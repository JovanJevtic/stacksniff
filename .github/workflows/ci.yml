name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
        env:
          # The test suite covers the pure detection/orchestration logic and
          # needs no browser, so skip the Chromium download in CI.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
